[project]
name = "topsbi"
authors = [
    { name = "C. Eddie McGrady", email = "cmcgrad2@nd.edu"}
]
version = "0.1.0"
description = "learning density ratio estimates for effective field theories"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "awkward>=2.10.0",
    "coffea>=2026.7.0",
    "dill>=0.4.1",
    "hist>=2.10.1",
    "matplotlib>=3.11.0",
    "mplhep>=1.3.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
    "xrootd>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb", "tests"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E401/E702: allow `import a, b` and `;` on one line (existing style).
# E721: TODO remove once type checks use isinstance (get_lower_tri's check never matches, see #4).
ignore = ["E401", "E702", "E721"]

[tool.ruff.lint.per-file-ignores]
# validation.py imports the removed expand_array; handled in #5.
"src/topsbi/validation.py" = ["F401"]
